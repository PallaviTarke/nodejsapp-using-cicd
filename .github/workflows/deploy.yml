name: Deploy Node.js App to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.GCP_VM_KEY }}

      - name: Copy files to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "mkdir -p ~/nodejs-app"
          rsync -avz --exclude '.git' ./ ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:~/nodejs-app

      - name: Install dependencies & restart app
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }} "
            cd ~/nodejs-app &&
            npm install &&
            pm2 restart nodejs-app || pm2 start app.js --name nodejs-app --time
          "
